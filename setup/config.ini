# MAPILLARY API CONFIG
[API_MAPILLARY]
token_env = MAPILLARY_TOKEN
url = https://graph.mapillary.com/images
fields = id,computed_geometry,geometry,captured_at,compass_angle,thumb_1024_url

[PATHS_MAPILLARY]
out_dir = data/raw/mapillary
images_subdir = images
meta_csv = metadata.csv
fieldnames = id, lon, lat, captured_at, compass_angle, thumb_1024_url

[TILING_MAPILLARY]
# 26 x 72 tiles, 5 degrees, ~555 km north to south
# east -> west it is 555 km at the äquator, 172 km at the northern edge
rows = 26
cols = 72
# probe window per tile, the API rejects bboxes above 0.01 square degrees
request_box_size = 0.09
# the window is shifted inside the tile until it finds images, at most this often
max_probes_per_cell = 10
#images / cell
cell_image_limit = 100
# set above rows* tiles * tile_limit
max_total = 500000
sleep_seconds = 0.1
timeout = 20

[BBOX_MAPILLARY]  # chapter 3.4
min_lon = -180
min_lat = -58
max_lon = 180
max_lat = 72

# radius around reference image centres,
# test images per centre
# and min distance of test image to any reference image
[TESTSET_MAPILLARY]
rings_km = 30, 100
per_centre = 3
min_distance_km = 10

# FEATURE AGGREGATION CONFIG
[AGGREGATION]
# spatial pyramid levels, 1 + 2*2 + 4*4 = 21 cells
pyramid_levels = 1,2,4
# empiric detection threshhold, detections below confidence level are discarded
confidence_threshold = 0.25
# floor which yolo even tries to detect, confidence_threshold must not fall below it.
detection_floor = 0.1

[PATHS_AGGREGATION]
# Modell 1: stock COCO weights, CATEGORIES_YOLO_PRETRAINED
# Modell 2: finetuned selected classes ,CATEGORIES_YOLO_NAMES
model_pretrained = data/models/yolo11m.pt
model_finetuned = runs/series260831/23classes_adam_8batch/weights/best.pt
vectors_dir = data/processed/vectors
#raw_vectors writes both .npy for db and .csv for control purposes
raw_vectors = raw_vectors
vector_ids = vector_ids.csv
norm_params = normalization_parameters.csv

# eval config, chapter 3.6, page 61
# 31-693: in this case, there are 55 dimensions max,
# but the entire range is considered for evaluation of future sets
[EVALUATION]
thresholds_km = 50, 200, 750, 2500
dimension_groups = 1-10, 11-20, 21-30, 31-693
# max range, in which images of same cluster should be located
# needs to be adjusted to way smaller values for larger db sizes
cluster_range_km = 100

[PATHS_EVALUATION]
# evaluation image set
test_dir = data/raw/mapillary_test
test_images_subdir = images
test_meta_csv = test_metadata.csv
evaluation_dir = data/processed/evaluation