# YOLO TRAINING CONFIG
[TRAIN_YOLO]
# increase to 100-200 epochs given the dataset size
epochs = 50
batch = 16
imgsz = 640
model = yolo11m.pt
seed = 42
# device: "0" for first GPU, "cpu" for CPU, "0,1" for multi-GPU
device = 0
workers = 6
patience = 40
# dataset caching; disabled due to stability issues; replaced by disk caching (requires 750 GB for training, 49 GB for Validation)
cache = disk
resume = false
run_name = 26classes_adam_8batch
run_overwrite = false
# Learning Hyperparameters
optimizer = Adam
lr_0 = 0.001
lr_f= 0.01
momentum = 0.9
weight_decay = 0.0005

[METRICS_YOLO]
precision = metrics/precision(B)
recall = metrics/recall(B)
map50 = metrics/mAP50(B)
map50_95 = metrics/mAP50-95(B)
train_box_loss = train/box_loss
train_cls_loss = train/cls_loss
train_dfl_loss = train/dfl_loss
val_box_loss = val/box_loss
val_cls_loss = val/cls_loss
val_dfl_loss = val/dfl_loss

# VISTAS TO YOLO CONVERSION CONFIG
[PATHS_YOLO]
raw = data/raw/vistas
train = training/images
val = validation/images
path = data/processed/yolo
runs_path = runs/series260831
runs_config = setup/training_configs/yolo_training_config_260831.csv
yaml_path = scripts/yolo/yolo.yaml
models_dir = data/models

[CATEGORIES_PANOPTIC]
# finetuning=y: 6 pretrained + 18 custom = 24 classes with Mapillary labels
0  = human--person--individual
1  = object--vehicle--car
